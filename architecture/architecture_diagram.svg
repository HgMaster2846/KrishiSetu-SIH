<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#F8FAFC"/>

  <!-- Title Header -->
  <rect x="0" y="0" width="1000" height="70" fill="#2E7D32"/>
  <text x="30" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">KrishiSetu AI ? High-Level System Architecture</text>
  <text x="30" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#C8E6C9">Smart India Hackathon 2026 ? Problem SIH 26033 (Digital Public Infrastructure for Feature Phone Farmers)</text>

  <!-- 1. FEATURE PHONE LAYER -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="220" height="420" rx="20" fill="url(#phoneGrad)"/>
    <text x="150" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Feature Phone Farmer</text>
    <text x="150" y="165" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Nokia 105 / JioPhone Bharat</text>

    <!-- Phone Screen Box -->
    <rect x="60" y="185" width="180" height="150" rx="8" fill="#022C22" stroke="#10B981" stroke-width="1.5"/>
    <text x="75" y="215" font-family="monospace" font-size="11" fill="#34D399" font-weight="bold">?? CALL 1800-260-3300</text>
    <text x="75" y="235" font-family="sans-serif" font-size="9" fill="#FFFFFF">AI: "Fasal bechna chahte hain?"</text>
    <text x="75" y="255" font-family="sans-serif" font-size="9" fill="#A7F3D0">Farmer: "200kg Tamatar"</text>
    <text x="75" y="280" font-family="monospace" font-size="10" fill="#FBBF24">?? SMS: Reply YES/1</text>
    <text x="75" y="300" font-family="sans-serif" font-size="8" fill="#94A3B8">Pickup: Kal 8 AM @ ?25.5</text>
    <text x="75" y="320" font-family="monospace" font-size="10" fill="#38BDF8">?? OTP: 582914</text>

    <!-- Keypad representation -->
    <g fill="#334155" font-family="sans-serif" font-size="10" font-weight="bold">
      <rect x="70" y="355" width="40" height="25" rx="4"/><text x="90" y="372" fill="#FFF" text-anchor="middle">1</text>
      <rect x="130" y="355" width="40" height="25" rx="4"/><text x="150" y="372" fill="#FFF" text-anchor="middle">2</text>
      <rect x="190" y="355" width="40" height="25" rx="4"/><text x="210" y="372" fill="#FFF" text-anchor="middle">3</text>

      <rect x="70" y="390" width="40" height="25" rx="4"/><text x="90" y="407" fill="#FFF" text-anchor="middle">4</text>
      <rect x="130" y="390" width="40" height="25" rx="4"/><text x="150" y="407" fill="#FFF" text-anchor="middle">5</text>
      <rect x="190" y="390" width="40" height="25" rx="4"/><text x="210" y="407" fill="#FFF" text-anchor="middle">6</text>

      <rect x="70" y="425" width="40" height="25" rx="4"/><text x="90" y="442" fill="#FFF" text-anchor="middle">7</text>
      <rect x="130" y="425" width="40" height="25" rx="4"/><text x="150" y="442" fill="#FFF" text-anchor="middle">8</text>
      <rect x="190" y="425" width="40" height="25" rx="4"/><text x="210" y="442" fill="#FFF" text-anchor="middle">9</text>

      <rect x="70" y="460" width="40" height="25" rx="4"/><text x="90" y="477" fill="#FFF" text-anchor="middle">*</text>
      <rect x="130" y="460" width="40" height="25" rx="4"/><text x="150" y="477" fill="#FFF" text-anchor="middle">0</text>
      <rect x="190" y="460" width="40" height="25" rx="4"/><text x="210" y="477" fill="#FFF" text-anchor="middle">#</text>
    </g>

    <text x="150" y="512" font-family="sans-serif" font-size="9" fill="#10B981" text-anchor="middle">? ZERO SMARTPHONE NEEDED</text>
  </g>

  <!-- Connectors from phone -->
  <path d="M 260 260 L 340 260" stroke="#2E7D32" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="300" y="250" font-family="sans-serif" font-size="10" fill="#2E7D32" font-weight="bold" text-anchor="middle">Voice / DTMF</text>

  <path d="M 260 300 L 340 370" stroke="#0284C7" stroke-width="2" stroke-dasharray="4" fill="none"/>
  <text x="300" y="345" font-family="sans-serif" font-size="9" fill="#0284C7" font-weight="bold" text-anchor="middle">SMS (2-Way)</text>

  <!-- 2. CLOUD TELEPHONY GATEWAY -->
  <g filter="url(#shadow)">
    <rect x="340" y="210" width="160" height="100" rx="12" fill="url(#cloudGrad)"/>
    <text x="420" y="245" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Cloud Telephony / IVR</text>
    <text x="420" y="265" font-family="sans-serif" font-size="10" fill="#BAE6FD" text-anchor="middle">Exotel / Twilio / Bhashini</text>
    <text x="420" y="285" font-family="sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">FastAPI Audio Streamer</text>
  </g>

  <!-- Connectors to AI Core -->
  <path d="M 500 260 L 560 260" stroke="#2E7D32" stroke-width="3" fill="none"/>

  <!-- 3. AI & INTELLIGENCE ENGINES -->
  <g filter="url(#shadow)">
    <rect x="560" y="110" width="220" height="420" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="560" y="110" width="220" height="45" rx="16" fill="url(#aiGrad)"/>
    <text x="670" y="138" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">FastAPI Core AI Engines</text>

    <!-- Engines -->
    <rect x="575" y="170" width="190" height="50" rx="8" fill="#F5F3FF" stroke="#DDD6FE"/>
    <text x="585" y="190" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6D28D9">1. Voice NLP & Listing Extractor</text>
    <text x="585" y="208" font-family="sans-serif" font-size="9" fill="#5B21B6">Whisper STT / Conversational NER</text>

    <rect x="575" y="230" width="190" height="50" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="585" y="250" font-family="sans-serif" font-size="11" font-weight="bold" fill="#047857">2. Buyer Recommendation Engine</text>
    <text x="585" y="268" font-family="sans-serif" font-size="9" fill="#065F46">Mandi 35% | Dist 20% | Trust 15%</text>

    <rect x="575" y="290" width="190" height="50" rx="8" fill="#FEF3C7" stroke="#FDE68A"/>
    <text x="585" y="310" font-family="sans-serif" font-size="11" font-weight="bold" fill="#B45309">3. Autonomous Negotiation Agent</text>
    <text x="585" y="328" font-family="sans-serif" font-size="9" fill="#92400E">Protects farmer reserve price & modal benchmark</text>

    <rect x="575" y="350" width="190" height="50" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="585" y="370" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1D4ED8">4. Pooled Logistics Matching</text>
    <text x="585" y="388" font-family="sans-serif" font-size="9" fill="#1E40AF">Shared truck capacity (?750 savings)</text>

    <rect x="575" y="410" width="190" height="50" rx="8" fill="#FFF1F2" stroke="#FECDD3"/>
    <text x="585" y="430" font-family="sans-serif" font-size="11" font-weight="bold" fill="#BE123C">5. Trust & Fraud Detection</text>
    <text x="585" y="448" font-family="sans-serif" font-size="9" fill="#9F1239">APMC KYC & Price Anomaly Filter</text>

    <rect x="575" y="470" width="190" height="45" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="585" y="490" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803D">6. SMS & Escrow Gateway</text>
    <text x="585" y="505" font-family="sans-serif" font-size="9" fill="#166534">OTP & Instant Bank DBT Release</text>
  </g>

  <!-- Connectors to Database & Clients -->
  <path d="M 670 530 L 670 580" stroke="#F59E0B" stroke-width="3" fill="none"/>
  
  <!-- 4. DATABASE LAYER -->
  <g filter="url(#shadow)">
    <rect x="560" y="580" width="220" height="70" rx="12" fill="url(#dbGrad)"/>
    <text x="670" y="610" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PostgreSQL / SQLite Database</text>
    <text x="670" y="630" font-family="sans-serif" font-size="10" fill="#FEF3C7" text-anchor="middle">Farmers ? Buyers ? Listings ? Negotiations ? Routes</text>
  </g>

  <!-- 5. SMART CLIENTS LAYER (Right Side) -->
  <path d="M 780 260 L 830 260" stroke="#2E7D32" stroke-width="3" fill="none"/>

  <g filter="url(#shadow)">
    <rect x="830" y="110" width="140" height="420" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="830" y="110" width="140" height="45" rx="16" fill="url(#primaryGrad)"/>
    <text x="900" y="138" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Smart Dashboards</text>

    <!-- Client Cards -->
    <rect x="840" y="170" width="120" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="900" y="195" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">Buyer Dashboard</text>
    <text x="900" y="212" font-family="sans-serif" font-size="8" fill="#64748B" text-anchor="middle">Marketplace & Bids</text>

    <rect x="840" y="250" width="120" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="900" y="275" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">Logistics Portal</text>
    <text x="900" y="292" font-family="sans-serif" font-size="8" fill="#64748B" text-anchor="middle">Truck Capacity & Routes</text>

    <rect x="840" y="330" width="120" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="900" y="355" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">Admin & Fraud</text>
    <text x="900" y="372" font-family="sans-serif" font-size="8" fill="#64748B" text-anchor="middle">KYC & Anomaly Control</text>

    <rect x="840" y="410" width="120" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="900" y="435" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">Mandi Intel Hub</text>
    <text x="900" y="452" font-family="sans-serif" font-size="8" fill="#64748B" text-anchor="middle">Agmarknet Price Feeds</text>

    <text x="900" y="505" font-family="sans-serif" font-size="9" fill="#2E7D32" font-weight="bold" text-anchor="middle">Flutter / Web UI</text>
  </g>
</svg>
